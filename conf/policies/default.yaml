ask_user:
  mode: interactive  # interactive (LangGraph interrupt) | disabled (tool not offered, Case.facts in the request)
citations:
  policy: reject     # reject | flag
  min_score: 0.9
  neighbour_pages: 0 # a quote is also searched this many pages before and after the cited one
  max_quote_chars: 160 # quotes longer than this are truncated in submit_study's error messages
  check_raster: false  # false: citations of documents without a text layer (the raster zoning plan) are recorded as not text-verifiable instead of checked
envelope:
  quad_segs: 8       # segments per quarter circle in the round setback buffers
  min_area_m2: 1.0   # footprint parts smaller than this are discarded as slivers
  level_step_m: 1.0  # massings are sliced this thick; equal consecutive slices merge
  cut_tolerance_m: 0.01  # precision of the cut positions splitting the footprint between buildings
  # Ready settings node for every caller of compute_envelope_study (submit_study, the architect's tools).
  settings:
    _target_: agent.runtime.geometry.envelope.study.EnvelopeSettings
    level_step_m: ${policies.envelope.level_step_m}
    quad_segs: ${policies.envelope.quad_segs}
    min_area_m2: ${policies.envelope.min_area_m2}
    cut_tolerance_m: ${policies.envelope.cut_tolerance_m}
study:
  required_notes: [rules, oap, destinations]  # doc_analyst labels submit_study requires, read from notes.<label>
evidence:
  crops_dir: data/crops  # where submit_study saves the evidence crops, relative to the project root
tracing:
  enabled: ${oc.decode:${oc.env:AGENT_TRACING,true}}  # set AGENT_TRACING=false to turn it off (the test suite does)
  project: davis-assessment
  endpoint: http://localhost:6006/v1/traces  # Phoenix collector (`uv run phoenix serve`)
  hide_images: true  # replace base64 images in span attributes by a placeholder: the collector drops oversized span batches
  base64_max_chars: 1000  # longest base64 run kept in a span attribute when images are hidden
logging:
  level: INFO
server:
  graph_cache_size: 8  # compiled graphs kept by the Agent Server factory, one per distinct override set
report:
  max_quote_chars: 200  # quotes longer than this are truncated in the report's citations table
