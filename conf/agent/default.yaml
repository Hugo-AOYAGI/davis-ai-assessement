# Orchestrator assembly.
prompt: prompts/orchestrator/system.md  # relative to the project root
model: orchestrator                     # key in models.nodes
general_purpose_subagent: false         # deepagents' built-in general-purpose sub-agent
language: English                       # language of the study's free text ($language in playbooks)
recursion_limit: 300                    # graph steps per run (CLI and evals)

# Task recipes loaded on demand with the `load_playbook` tool. Each file may use $language.
playbooks:
  study:
    description: >-
      Full buildability study of an address for a construction program: site and zone, the
      rules and OAP notes, decisions and ambiguities, then submit_study.
    path: prompts/playbooks/study.md

# Initial message of a CLI or eval run, rendered from the Case ($address, $program, $facts).
request: prompts/orchestrator/request.md
no_facts: "- none given"

tools:
  - _target_: agent.tools.submit.reader.read_artifact_tool
  - _target_: agent.tools.study.gate.submit_study_tools   # submit_study and revise_study
    name: submit_study
    artifact: study
    corpus:                           # provider, called on the first submission
      _target_: agent.adapters.corpus.store.load_corpus
      _partial_: true
      directory:
        _target_: agent.agents.config.project_path
        relative: ${corpus.dir}
    citations:
      _target_: agent.tools.study.checks.citation_rules
      policy: ${policies.citations.policy}
      min_score: ${policies.citations.min_score}
      neighbour_pages: ${policies.citations.neighbour_pages}
      max_quote_chars: ${policies.citations.max_quote_chars}
      check_raster: ${policies.citations.check_raster}
    inputs:                           # artifacts the gate reads, and who delivers them
      _target_: agent.tools.study.inputs.StudyInputs
      site: {artifact: site, producer: surveyor}
      zone: {artifact: zone, producer: zoning_analyst}
      notes: {artifact: "notes.{label}", producer: doc_analyst}
      labels: ${policies.study.required_notes}
    geometry:
      _target_: agent.tools.study.gate.GeometrySettings
      snap_tolerance_m: ${geo.edges.snap_tolerance_m}
      collinear_angle_deg: ${geo.edges.collinear_angle_deg}
      quad_segs: ${policies.envelope.quad_segs}
      min_area_m2: ${policies.envelope.min_area_m2}
    images: ${images.pages}
    crops_dir:
      _target_: agent.agents.config.project_path
      relative: ${policies.evidence.crops_dir}
