zoning_map_reader:
  description: >-
    Reads the raster zoning plan around the site and reports the zone, the plan overlays checked
    against the site (applicable or not) and whether the site lies inside an OAP perimeter, with
    citations to the plan. Needs the site (submitted by site_locator) to be known first.
  prompt: prompts/subagents/zoning_map_reader.md
  model: zoning_map_reader  # key in models.nodes
  tools:
    - _target_: agent.tools.map.view.view_map_tool
      plan: ${corpus.zoning_map}
      site_artifact: site            # state artifact holding the SiteContext
      default_half_width_m: 150      # half-width of the crop when the model gives none
      min_half_width_m: 80
      max_half_width_m: 1500
      max_output_px: 1200            # long edge of the returned image
      max_upscale: 4.0               # zoom factor cap over the plan's native resolution
      outline_rgb: [0, 229, 255]     # site outline colour, absent from the plan's legend
      outline_width_px: 3
    - _target_: agent.tools.map.legend.view_legend_tool
      plan: ${corpus.zoning_map}
      max_output_px: 1400
    - _target_: agent.tools.submit.factory.submit_tool
      artifact: map_findings         # state key; tool is named submit_map_findings
      contract: {_target_: hydra.utils.get_class, path: agent.contracts.findings.map.MapFindings}
