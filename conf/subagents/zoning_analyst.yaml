# Zoning analyst: the site on the zoning plan -> ZoneFindings (artifact `zone`).
zoning_analyst:
  description: >-
    Reads the zoning plan for the site: sees the site outlined on the georeferenced plan, reads
    its zone and checks every legend item (overlays, perimeters, protections) as applying or
    not. Needs the site first (surveyor's `site` artifact): give it the address and the parcel
    ids. Delivers the artifact `zone`.
  prompt: prompts/subagents/zoning_analyst.md
  model: zoning_analyst  # key in models.nodes
  # Only the images of the last N image-holding messages reach the model (older ones become a
  # text notice; state keeps them all); null sends every image.
  max_images: 4
  tools:
    - _target_: agent.tools.documents.navigate.list_documents_tool
      corpus: ${retrieval.corpus}
      documents: ${corpus.documents}
    - ${geo.plan_site}
    - ${geo.site_view}
    - _target_: agent.tools.images.view.view_image_tool
      pages: ${images.pages}
      store: ${images.store}
    - _target_: agent.tools.images.view.zoom_tool
      pages: ${images.pages}
      store: ${images.store}
    - _target_: agent.tools.submit.factory.submit_tools  # submit_<x> and revise_<x>
      name: submit_zone
      artifact: zone
      contract: {_target_: hydra.utils.get_class, path: agent.contracts.findings.zone.ZoneFindings}
      finalize:                    # the region must lie on its page
        _target_: agent.tools.images.zone.zone_finalizer
        images: ${images.pages}
