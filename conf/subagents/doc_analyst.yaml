# Document analyst: documents read for an aim -> DocNotes (artifact `notes.<label>`). Tool knobs
# come from the `retrieval` group.
doc_analyst:
  description: >-
    Reads the planning documents (regulation, OAP, diagrams) for one aim and returns what they
    say as cited notes, one or more per topic, plus the open points they leave; it extracts, it
    does not decide. Give it a `label` (lowercase id naming this run, e.g. `rules`), the `aim`,
    the `topics` checklist (may be empty), the `context` you already know (zone, legend items,
    parcel ids, program) and, optionally, the `documents` it may read. Delivers the artifact
    `notes.<label>`.
  prompt: prompts/subagents/doc_analyst.md
  model: doc_analyst  # key in models.nodes
  tools:
    - _target_: agent.tools.documents.navigate.list_documents_tool
      corpus: ${retrieval.corpus}
      documents: ${corpus.documents}
    - _target_: agent.tools.documents.navigate.list_sections_tool
      corpus: ${retrieval.corpus}
    - _target_: agent.tools.documents.navigate.read_section_tool
      corpus: ${retrieval.corpus}
      mode: ${retrieval.mode}
      max_chars: ${retrieval.max_chars}
    - _target_: agent.tools.documents.lookup.search_tool
      corpus: ${retrieval.corpus}
      k: ${retrieval.search_k}
      snippet_chars: ${retrieval.snippet_chars}
    - _target_: agent.tools.documents.navigate.read_pages_tool
      corpus: ${retrieval.corpus}
      max_pages: ${retrieval.max_pages}
      max_chars: ${retrieval.max_chars}
    - _target_: agent.tools.images.view.view_image_tool
      pages: ${images.pages}
    - _target_: agent.tools.images.view.zoom_tool
      pages: ${images.pages}
    - ${geo.site_view}
    - _target_: agent.tools.submit.factory.submit_tool
      name: submit_notes
      artifact: "notes.{label}"
      contract: {_target_: hydra.utils.get_class, path: agent.contracts.findings.notes.DocNotes}
      finalize:                    # every quote checked on its page, every view on its page
        _target_: agent.tools.documents.notes.notes_finalizer
        corpus: ${retrieval.corpus}
        images: ${images.pages}
        policy: ${policies.citations.policy}
        min_score: ${policies.citations.min_score}
        neighbour_pages: ${policies.citations.neighbour_pages}
        max_quote_chars: ${policies.citations.max_quote_chars}
        check_raster: ${policies.citations.check_raster}
