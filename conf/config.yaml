# Root configuration and default groups.
#
# `subagents` is a multi-select group: one file per sub-agent in conf/subagents/, whose content
# is nested under a top-level key equal to the file name (conf/subagents/surveyor.yaml starts
# with `surveyor:`), so several selected files merge side by side into `subagents.<name>`.
# The three study sub-agents are enabled below; select others on the command line, e.g.
# `subagents=[surveyor,zoning_analyst]`.
defaults:
  - models: default
  - agent: default
  - case: reference
  - policies: default
  - corpus: default
  - geo: default
  - images: default
  - retrieval: full_sections
  - subagents: [surveyor, zoning_analyst, doc_analyst]
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

subagents: {}  # an empty selection leaves no `subagents` key; this keeps it present
