# Per-node chat models. Temperature is left unset: Claude 5.5 models reject non-default values.
# Every agent node runs on Haiku 5.5 except the zoning analyst, which reads the georeferenced plan
# and runs on Sonnet 5.5 at medium effort (the eval judge also uses Sonnet). Switch another node
# to Sonnet from the command line with
# `models.nodes.<node>.model=claude-sonnet-5-5 +models.nodes.<node>.effort=medium`.

pricing:  # USD per million tokens; cache_write is the 5-minute TTL rate
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
  claude-opus-5-5:  # optional judge comparison; check against the published price list
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write: 6.25
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125

nodes:
  # No `effort`: the langchain-anthropic profile for Haiku 5.5 declares no reasoning-effort
  # levels. Its max output is 128000 tokens.
  surveyor: &agent
    _target_: langchain_anthropic.ChatAnthropic
    model: claude-haiku-5-5
    max_tokens: 16000
    max_retries: 3
    timeout: 300
    # Sub-agent replies reach the chat UI whole, not token by token: two sub-agents streaming
    # long tool calls in parallel send hundreds of chunks per second, more than the browser
    # can process. LangGraph's `messages` stream skips the tokens of models tagged `nostream`.
    tags: [nostream]
  zoning_analyst:  # reads labels and hatchings around the georeferenced parcel outline
    <<: *agent
    model: claude-sonnet-5-5
    effort: medium
  orchestrator:  # its submit_study call carries the whole study in one reply
    <<: *agent
    max_tokens: 32000
    tags: []     # its replies stream token by token in the chat
  doc_analyst:  # its submit_notes call carries every note and citation in one reply
    <<: *agent
    max_tokens: 32000
  architect: *agent  # a submit_envelope call (rules, citations, layout) is a few thousand tokens
  ingest_classifier:
    <<: *agent
    max_tokens: 1024
    timeout: 60
  judge:  # yes/no eval judge (evals/harness/judge.py), never used by the agent
    <<: *agent
    model: claude-sonnet-5-5
    max_tokens: 2000
    tags: []
