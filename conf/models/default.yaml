# Per-node chat models. Temperature is left unset: Claude 5.5 models reject non-default values.
# Override one node from the command line, e.g. `models.nodes.surveyor.model=claude-haiku-5-5`.

pricing:  # USD per million tokens; cache_write is the 5-minute TTL rate
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125

nodes:
  orchestrator: &agent
    _target_: langchain_anthropic.ChatAnthropic
    model: claude-sonnet-5-5
    max_tokens: 16000
    max_retries: 3
    timeout: 300
    effort: medium  # low | medium | high | xhigh | max
  surveyor: *agent
  zoning_analyst: *agent
  doc_analyst: *agent
  # No `effort`: the langchain-anthropic profile for Haiku 5.5 declares no reasoning-effort levels.
  ingest_classifier:
    _target_: langchain_anthropic.ChatAnthropic
    model: claude-haiku-5-5
    max_tokens: 1024
    max_retries: 3
    timeout: 60
