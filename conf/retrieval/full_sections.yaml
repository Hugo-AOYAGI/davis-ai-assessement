# Retrieval over the ingested corpus, read by the document tools (agent.tools.documents).
# `full_sections`: read_section returns a section with all its sub-sections, so a whole zone
# chapter or glossary arrives in one call. Select the other variant with `retrieval=navigation`.
mode: full_sections   # full_sections | navigation
corpus:               # where the tools read the corpus; loaded on first tool call, then shared
  _target_: agent.tools.documents.source.CorpusSource
  directory:
    _target_: agent.agents.config.project_path
    relative: ${corpus.dir}
  stopwords: ${corpus.search.stopwords}
  expected_id: ${corpus.id}
max_chars: 120000     # longest tool reply; longer text is cut with a hint to read narrower
max_pages: 4          # pages per read_pages call
search_k: 8           # hits per search call
snippet_chars: 300    # text shown around each search hit
