[project]
name = "davis-assessment"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "colorama>=0.4.6",
    "deepagents>=0.7.28",
    "httpx>=0.28.1",
    "hydra-core>=1.3.7",
    "langchain-anthropic>=1.7.6",
    "langgraph-cli[inmem]>=0.4.36",
    "openinference-instrumentation-langchain>=0.1.79",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "pyproj>=3.8.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "shapely>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[dependency-groups]
dev = [
    "arize-phoenix>=20.23.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["tools", "ressources"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "D", "ANN", "PL", "RUF", "T20",
    "TID", "PTH", "C90", "ARG", "RET", "ERA", "S", "BLE",
]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101", "PLR2004", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"
root = ["./src", "./tests"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["tools", "ressources"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
