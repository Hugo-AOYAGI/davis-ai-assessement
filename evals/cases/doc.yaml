- id: d15_ugd_housing
  tests: zone x program grid, Vallée UGd housing (site of z13_ugd); UGd shares the 15 % footprint with UGa but not every limit
  label: rules
  zone: UGd
  sector: Vallée
  program: housing
  documents: [plu_reglement]
  legend_items: []
  focus: [footprint ratio, height, setbacks, parking per dwelling]
  trap: applying the general UG figures or the UGa height

- id: d16_ugc_housing
  tests: zone x program grid, Vallée UGc housing (site of z14_ugc)
  label: rules
  zone: UGc
  sector: Vallée
  program: housing
  documents: [plu_reglement]
  legend_items: []
  focus: [footprint ratio, height, setbacks, parking per dwelling]
  trap: applying the UGa / UGd 15 % footprint to UGc

- id: d17_uca_housing
  tests: zone x program grid, UCa housing (site of z02_zone_boundary, its UCa part)
  label: rules
  zone: UCa
  sector: Vallée
  program: housing
  documents: [plu_reglement]
  legend_items: []
  focus: [footprint ratio, height, setbacks, parking per dwelling]
