- id: d18_uhe_housing
  tests: zone x program grid, UHe housing (site of z19_uhe)
  label: rules
  zone: UHe
  sector: Vallée
  program: housing
  documents: [plu_reglement]
  legend_items: []
  focus: [footprint ratio, height, setbacks, parking per dwelling, what makes UHe differ from UH]
