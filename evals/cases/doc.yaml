- id: d19_uxc_offices
  tests: zone x program grid, UXc economic zone (site of z09_uxc); offices or activities are the main use, housing is restricted
  label: rules
  zone: UXc
  sector: Vallée
  program: offices
  documents: [plu_reglement]
  legend_items: []
  focus: [whether offices are permitted, height, footprint, setbacks, parking for offices]
  trap: collapsing UXc into UX, or stating housing rules

- id: d20_n_housing
  tests: zone x program grid, negative case, natural zone N (site of z07_natural_zone); new housing is prohibited or tightly restricted
  label: rules
  zone: N
  sector: Vallée
  program: housing
  documents: [plu_reglement]
  legend_items: []
  focus: [article 1 prohibited uses, article 2 conditional uses (extensions of existing dwellings, annexes), any figure for those]
  trap: giving a buildable envelope for new housing as if it were permitted
